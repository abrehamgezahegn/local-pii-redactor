[project]
name = "local-pii-redactor"
version = "0.1.0"
description = "Local image PII redaction with Ollama, Tesseract, and Pillow"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "Pillow>=11.1,<14", "pillow-heif>=1.1,<2", "pydantic>=2.10,<3", "PySide6-Essentials>=6.9,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6.16,<7"]

[project.scripts]
pii-redactor = "pii_redactor.cli:main"
local-redact = "pii_redactor.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pii_redactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
